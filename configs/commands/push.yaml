# Push recovery: lateral and frontal impulses on the pelvis while walking (force in N, world frame).
name: push
segments:
  - {duration: 2.0, command: [0.0, 0.0, 0.0]}
  - {duration: 3.0, command: [0.5, 0.0, 0.0]}
  - {duration: 0.2, command: [0.5, 0.0, 0.0], push: [0.0, 120.0, 0.0]}
  - {duration: 3.0, command: [0.5, 0.0, 0.0]}
  - {duration: 0.2, command: [0.5, 0.0, 0.0], push: [-120.0, 0.0, 0.0]}
  - {duration: 3.0, command: [0.5, 0.0, 0.0]}
