name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch MuJoCo Menagerie G1 (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie sparse-checkout set unitree_g1
      - run: python -m pip install -e ".[mujoco,dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q --basetemp=/tmp/hls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim2sim-smoke
          path: /tmp/hls/**/*.json

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google-deepmind/mujoco_menagerie.git third_party/mujoco_menagerie
          git -C third_party/mujoco_menagerie sparse-checkout set unitree_g1
      - run: python -m pip install -e ".[mujoco,dev]"
      - run: cmake -S cpp -B build -G Ninja && cmake --build build
      - name: C++ loop reproduces the Python plant bit for bit
        run: pytest -q tests/test_cpp_parity.py
