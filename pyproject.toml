[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-locomotion-sim2sim"
version = "0.1.0"
description = "Unitree G1 locomotion: Isaac Lab RL -> ONNX -> MuJoCo sim-to-sim -> 1 kHz C++ control"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eric Rosenfeld" }]
dependencies = ["numpy>=1.26", "onnxruntime>=1.18", "pyyaml>=6"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.2", "imageio[ffmpeg]>=2.34", "matplotlib>=3.8"]
isaac = ["gymnasium>=0.29"]          # isaaclab itself is installed by scripts/setup-isaaclab-windows.ps1
dev = ["pytest>=8", "ruff>=0.5", "onnx>=1.16"]

[project.scripts]
hls = "humanoid_loco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
